name: Release new version

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version-without-v }}
      prerelease: ${{ steps.get-version.outputs.prerelease != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the script can check the tagged commit is on master
          fetch-depth: 0
      - name: Get version from tag
        id: get-version
        uses: battila7/get-version-action@v2
      - name: Validate release
        env:
          TAG_VERSION: ${{ steps.get-version.outputs.version-without-v }}
        run: ./scripts/validate-release.sh "${TAG_VERSION}"

  docs:
    name: Docs
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build docs
        run: ./scripts/build-docs.sh --warnings-as-errors --archive "Moffat.EndlessOnline.SDK-${VERSION}-docs.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: Moffat.EndlessOnline.SDK-${{ needs.validate.outputs.version }}-docs
          path: Moffat.EndlessOnline.SDK-*-docs.tar.gz
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet package
    # Wait for the docs, so a docs failure stops the release before anything is published
    needs: [validate, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Pack NuGet package
        run: dotnet pack Moffat.EndlessOnline.SDK/Moffat.EndlessOnline.SDK.csproj -c Release --no-build --no-restore -o ${{ github.workspace }}/pkgs
      - name: Push to NuGet
        uses: edumserrano/nuget-push@v1.2.2
        with:
          api-key: "${{ secrets.NUGET_PUSH_API_KEY }}"
          nuget-package: ${{ github.workspace }}/pkgs/*.nupkg

  github-release:
    name: GitHub release
    needs: [validate, docs, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Parse changelog
        id: changelog
        uses: coditory/changelog-parser@v1
        with:
          version: ${{ needs.validate.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Moffat.EndlessOnline.SDK v${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.description }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
